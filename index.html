<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>birpe</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #ffffff;
    overflow: hidden;
  }
  img {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <picture>
    <source media="(max-width: 768px)" srcset="img-9939f1f90c2f.jpg">
    <img src="img-0073f86b739a.jpg" alt="">
  </picture>
  <script>
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', function (e) {
      var k = e.key.toLowerCase();
      if (k === 'f12') { e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) { e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && (k === 'u' || (e.altKey && k === 'i'))) { e.preventDefault(); return; }
    });
  </script>
</body>
</html>
